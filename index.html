<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compare slider</title>
<style>
  :root {
    --bg: #2b2b2b;
    --line: #ffffff;
    --handle-bg: rgba(60, 60, 60, .55);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: var(--bg); overflow: hidden; }

  .compare {
    position: relative;
    width: 100%;
    height: 100%;
    background: var(--bg);
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: pan-y;      /* cho phép cuộn dọc trang, kéo ngang để chạy slider */
    cursor: ew-resize;
    --pos: 50%;
  }
  .layer { position: absolute; inset: 0; }
  .layer > img, .layer > video {
    width: 100%; height: 100%;
    object-fit: contain;      /* đổi thành "cover" nếu muốn lấp đầy khung */
    display: block;
    pointer-events: none;
    -webkit-user-drag: none;
  }
  /* lớp "trước" nằm trên, bị cắt theo vị trí slider */
  .layer.top { clip-path: inset(0 calc(100% - var(--pos)) 0 0); }

  .divider {
    position: absolute; top: 0; bottom: 0;
    left: var(--pos);
    width: 2px; margin-left: -1px;
    background: var(--line);
    pointer-events: none;
  }
  .handle {
    position: absolute; top: 50%;
    left: var(--pos);
    width: 52px; height: 52px;
    margin: -26px 0 0 -26px;
    border-radius: 50%;
    border: 3px solid var(--line);
    background: var(--handle-bg);
    backdrop-filter: blur(4px);
    display: grid; place-items: center;
    pointer-events: none;
    transition: transform .15s ease;
  }
  .compare.dragging .handle { transform: scale(1.1); }
  .handle svg { width: 22px; height: 22px; }

  .compare:focus-visible { outline: 2px solid #fff; outline-offset: -4px; }

  .tag {
    position: absolute; bottom: 12px;
    padding: 4px 10px; border-radius: 4px;
    font: 500 12px/1.2 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #fff; background: rgba(0,0,0,.45);
    pointer-events: none;
  }
  .tag.l { left: 12px; }
  .tag.r { right: 12px; }
  .tag:empty { display: none; }

  .playbtn {
    position: absolute; top: 12px; right: 12px;
    width: 38px; height: 38px; border-radius: 50%;
    border: 2px solid #fff; background: rgba(0,0,0,.45);
    color: #fff; cursor: pointer; display: none; place-items: center;
  }
  .playbtn:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .compare.is-video .playbtn { display: grid; }
  .playbtn svg { width: 16px; height: 16px; fill: #fff; }

  @media (prefers-reduced-motion: reduce) { .handle { transition: none; } }
</style>
</head>
<body>

<div class="compare" id="cmp" tabindex="0" role="slider"
     aria-label="Kéo để so sánh trước và sau"
     aria-valuemin="0" aria-valuemax="100" aria-valuenow="50">
  <div class="layer bottom" id="bottom"></div>
  <div class="layer top" id="top"></div>
  <div class="divider"></div>
  <div class="handle">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 5 16 12 9 19"/></svg>
  </div>
  <span class="tag l" id="tagL"></span>
  <span class="tag r" id="tagR"></span>
  <button class="playbtn" id="playbtn" aria-label="Phát / tạm dừng"></button>
</div>

<script>
/* =========================================================
   CẤU HÌNH
   Cách 1: sửa trực tiếp các giá trị mặc định bên dưới.
   Cách 2: truyền qua URL, ví dụ:
     compare-slider.html?type=image&before=a.jpg&after=b.jpg
     compare-slider.html?type=video&before=a.mp4&after=b.mp4&poster=cover.jpg
   Tham số: type (image|video), before, after, labelBefore, labelAfter,
            start (0-100), fit (contain|cover), bg (mã màu không có #),
            autoplay (1|0), intro (1|0)
   ========================================================= */
var CONFIG = {
  type: "image",                 // "image" hoặc "video"
  before: "https://example.com/before.jpg",
  after:  "https://example.com/after.jpg",
  poster: "",                    // ảnh bìa cho video (tuỳ chọn)
  labelBefore: "",               // ví dụ "Render"
  labelAfter: "",                // ví dụ "Wireframe"
  start: 50,                     // vị trí ban đầu (%)
  fit: "contain",
  bg: "",
  autoplay: true,                // chỉ áp dụng cho video (luôn tắt tiếng)
  intro: true                    // hiệu ứng trượt nhẹ một lần khi tải
};

(function () {
  var q = new URLSearchParams(location.search);
  ["type","before","after","poster","labelBefore","labelAfter","fit","bg"].forEach(function (k) {
    if (q.get(k)) CONFIG[k] = q.get(k);
  });
  if (q.get("start")) CONFIG.start = parseFloat(q.get("start"));
  if (q.get("autoplay")) CONFIG.autoplay = q.get("autoplay") !== "0";
  if (q.get("intro")) CONFIG.intro = q.get("intro") !== "0";
  if (CONFIG.bg) document.documentElement.style.setProperty("--bg", "#" + CONFIG.bg.replace("#",""));

  var cmp = document.getElementById("cmp");
  var top = document.getElementById("top");
  var bottom = document.getElementById("bottom");
  var isVideo = CONFIG.type === "video";
  var pos = clamp(CONFIG.start);

  document.getElementById("tagL").textContent = CONFIG.labelBefore;
  document.getElementById("tagR").textContent = CONFIG.labelAfter;

  function clamp(v) { return Math.min(100, Math.max(0, v)); }
  function setPos(v) {
    pos = clamp(v);
    cmp.style.setProperty("--pos", pos + "%");
    cmp.setAttribute("aria-valuenow", Math.round(pos));
  }

  /* ---------- Tạo media ---------- */
  function makeMedia(src) {
    var el;
    if (isVideo) {
      el = document.createElement("video");
      el.src = src;
      el.muted = true; el.defaultMuted = true;
      el.loop = true;
      el.playsInline = true;
      el.setAttribute("playsinline", "");
      el.preload = "auto";
      if (CONFIG.poster) el.poster = CONFIG.poster;
    } else {
      el = document.createElement("img");
      el.src = src; el.alt = ""; el.draggable = false;
    }
    el.style.objectFit = CONFIG.fit;
    return el;
  }
  var mTop = makeMedia(CONFIG.before);     // bên trái
  var mBottom = makeMedia(CONFIG.after);   // bên phải
  top.appendChild(mTop);
  bottom.appendChild(mBottom);

  /* ---------- Đồng bộ video ---------- */
  var btn = document.getElementById("playbtn");
  var ICON_PAUSE = '<svg viewBox="0 0 24 24"><rect x="5" y="4" width="5" height="16"/><rect x="14" y="4" width="5" height="16"/></svg>';
  var ICON_PLAY  = '<svg viewBox="0 0 24 24"><polygon points="6,4 20,12 6,20"/></svg>';

  if (isVideo) {
    cmp.classList.add("is-video");
    btn.innerHTML = ICON_PAUSE;

    var playing = false;
    function playBoth() {
      var p1 = mTop.play(), p2 = mBottom.play();
      Promise.all([p1, p2]).then(function () { playing = true; btn.innerHTML = ICON_PAUSE; })
        .catch(function () { playing = false; btn.innerHTML = ICON_PLAY; });
    }
    function pauseBoth() { mTop.pause(); mBottom.pause(); playing = false; btn.innerHTML = ICON_PLAY; }

    btn.addEventListener("click", function (e) { e.stopPropagation(); playing ? pauseBoth() : playBoth(); });
    btn.addEventListener("pointerdown", function (e) { e.stopPropagation(); });

    // video "trước" là mốc thời gian; kéo video còn lại về nếu lệch > 0.08s
    mTop.addEventListener("timeupdate", function () {
      if (Math.abs(mBottom.currentTime - mTop.currentTime) > 0.08) {
        mBottom.currentTime = mTop.currentTime;
      }
    });
    mTop.addEventListener("seeked", function () { mBottom.currentTime = mTop.currentTime; });

    if (CONFIG.autoplay) {
      var ready = 0;
      var go = function () { if (++ready === 2) playBoth(); };
      mTop.addEventListener("canplay", go, { once: true });
      mBottom.addEventListener("canplay", go, { once: true });
    } else {
      btn.innerHTML = ICON_PLAY;
    }
  }

  /* ---------- Kéo slider ---------- */
  var dragging = false;
  function fromEvent(e) {
    var r = cmp.getBoundingClientRect();
    setPos(((e.clientX - r.left) / r.width) * 100);
  }
  cmp.addEventListener("pointerdown", function (e) {
    dragging = true; introCancelled = true;
    cmp.classList.add("dragging");
    cmp.setPointerCapture(e.pointerId);
    fromEvent(e);
  });
  cmp.addEventListener("pointermove", function (e) { if (dragging) fromEvent(e); });
  function end(e) {
    dragging = false;
    cmp.classList.remove("dragging");
    try { cmp.releasePointerCapture(e.pointerId); } catch (_) {}
  }
  cmp.addEventListener("pointerup", end);
  cmp.addEventListener("pointercancel", end);

  // Bàn phím: ← → để chỉnh, Home/End về hai đầu
  cmp.addEventListener("keydown", function (e) {
    var step = e.shiftKey ? 10 : 2;
    if (e.key === "ArrowLeft")  { setPos(pos - step); e.preventDefault(); }
    if (e.key === "ArrowRight") { setPos(pos + step); e.preventDefault(); }
    if (e.key === "Home") { setPos(0); e.preventDefault(); }
    if (e.key === "End")  { setPos(100); e.preventDefault(); }
    introCancelled = true;
  });

  /* ---------- Hiệu ứng gợi ý một lần ---------- */
  var introCancelled = false;
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  setPos(pos);
  if (CONFIG.intro && !reduce) {
    var t0 = null, base = pos, dur = 1600;
    function frame(t) {
      if (introCancelled) return;
      if (t0 === null) t0 = t;
      var k = Math.min(1, (t - t0) / dur);
      setPos(base + Math.sin(k * Math.PI * 2) * 12 * (1 - k));
      if (k < 1) requestAnimationFrame(frame); else setPos(base);
    }
    setTimeout(function () { requestAnimationFrame(frame); }, 500);
  }
})();
</script>
</body>
</html>
